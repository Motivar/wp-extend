# GitLab CI template shipped by motivar/wp-self-test.
#
# Include it from a consumer plugin's .gitlab-ci.yml (the package is in the
# committed vendor directory, so `local:` works):
#
#   include:
#     - local: 'lib/motivar/wp-self-test/ci/gitlab-ci.yml'
#   variables:
#     MWP_TESTS_DB_NAME: my_plugin_tests   # optional overrides, see below
#
# The `mwp-self-test` job installs the PHPUnit/WordPress toolchain from
# `$MWP_TESTS_DIR/composer.json`, lints every tracked PHP file, runs
# PHPUnit when phpunit.xml.dist exists, then runs every registered
# self-test manifest through bin/run.php against a throwaway database.
#
# @package Motivar\SelfTest
# @since   0.1.0

variables:
  MWP_SELF_TEST_DIR: 'lib/motivar/wp-self-test'
  MWP_TESTS_DIR: 'tests'
  MWP_PHP_IMAGE: 'php:8.2-cli'
  MWP_TESTS_DB_NAME: 'wp_tests'
  MYSQL_DATABASE: '$MWP_TESTS_DB_NAME'
  MYSQL_USER: 'db'
  MYSQL_PASSWORD: 'db'
  MYSQL_ROOT_PASSWORD: 'root'
  WP_TESTS_DB_HOST: 'mariadb'
  WP_TESTS_DB_NAME: '$MWP_TESTS_DB_NAME'
  WP_TESTS_DB_USER: 'db'
  WP_TESTS_DB_PASSWORD: 'db'
  # tests/composer.json (johnpbloch/wordpress-core) downloads a fresh core here.
  WP_CORE_DIR: '$CI_PROJECT_DIR/$MWP_TESTS_DIR/vendor/johnpbloch/wordpress-core'

mwp-self-test:
  stage: test
  image: $MWP_PHP_IMAGE
  services:
    - name: mariadb:10.4
      alias: mariadb
  before_script:
    - apt-get update -yqq
    - apt-get install -yqq git unzip libzip-dev default-mysql-client
    - docker-php-ext-install mysqli zip >/dev/null
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - 'git ls-files -z -- "*.php" | xargs -0 -n1 php -l >/dev/null'
    - cd "$MWP_TESTS_DIR" && composer install --no-interaction --prefer-dist --no-progress && cd "$CI_PROJECT_DIR"
    - until mysqladmin ping -h mariadb -u root -proot --silent; do sleep 1; done
  script:
    - 'if [ -f phpunit.xml.dist ]; then "$MWP_TESTS_DIR/vendor/bin/phpunit" -c phpunit.xml.dist; fi'
    - php "$MWP_SELF_TEST_DIR/bin/run.php" --autoload="$MWP_TESTS_DIR/vendor/autoload.php" --bootstrap="$MWP_TESTS_DIR/bootstrap.php"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push"'

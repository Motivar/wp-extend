<div id="snap-box" class="awm-show-content" count="2">
<div class="form-field term-group awm-term-meta-row awm-meta-term-field input text awm-meta-field">
<label for="snap_text" class="awm-input-label">
<span>First</span>
</label>
<div class="input-wrapper">
<input type="text" name="snap_text" id="snap_text" value="" class=""/>
</div>
<input type="hidden" name="awm_custom_meta[]" value="snap_text"/>
</div>
<div class="form-field term-group awm-term-meta-row awm-meta-term-field select awm-meta-field">
<label for="snap_select" class="awm-input-label">
<span>Second</span>
</label>
<select name="snap_select" id="snap_select" class="">
<option value="" data-html="'Second'" data-placeholder="true">Second</option>
<option value="a" data-html="'A'">A</option>
<option value="b" data-html="'B'">B</option>
<option value="c" data-html="'C'">C</option>
</select>
<input type="hidden" name="awm_custom_meta[]" value="snap_select"/>
</div>
</div>

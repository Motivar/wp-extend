<div id="snap-box" class="awm-show-content" count="2">
<tr class="form-field term-group-wrap awm-meta-term-field" data-input="snap_text">
<th scope="row" class="input text awm-meta-field" data-input="snap_text" data-type="input">
<label for="snap_text" class="awm-input-label">First</label>
</th>
<td class="awm-term-input">
<label for="snap_text" class="awm-input-label">
<span>First</span>
</label>
<div class="input-wrapper">
<input type="text" name="snap_text" id="snap_text" value="Hello &quot;world&quot; &lt;b&gt;" class=""/>
</div>
<input type="hidden" name="awm_custom_meta[]" value="snap_text"/>
</td>
</tr>
<tr class="form-field term-group-wrap awm-meta-term-field" data-input="snap_select">
<th scope="row" class="select awm-meta-field" data-input="snap_select" data-type="select">
<label for="snap_select" class="awm-input-label">Second</label>
</th>
<td class="awm-term-input">
<label for="snap_select" class="awm-input-label">
<span>Second</span>
</label>
<select name="snap_select" id="snap_select" class="">
<option value="" data-html="'Second'" data-placeholder="true">Second</option>
<option value="a" data-html="'A'">A</option>
<option value="b" selected data-html="'B'">B</option>
<option value="c" data-html="'C'">C</option>
</select>
<input type="hidden" name="awm_custom_meta[]" value="snap_select"/>
</td>
</tr>
</div>

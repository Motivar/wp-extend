# Version: 1.1.0
#
# Tests run through the gnnpls/wp-self-test package's job template
# (lib/gnnpls/wp-self-test/ci/gitlab-ci.yml): PHP lint, the PHPUnit suite
# (tests/, toolchain from tests/composer.json) and every self-test manifest
# through bin/run.php, against a throwaway MariaDB. Locally the same two
# suites run via `composer test` (tests/run-tests.sh) and the pre-push hook.
include:
  - project: "tools/motivar-cicd-files"
    ref: main
    file: ".gitlab-ci-mtv-plugins-wiki.yml"
  - local: "lib/gnnpls/wp-self-test/ci/gitlab-ci.yml"

variables:
  MWP_TESTS_DB_NAME: wp_extend_tests
